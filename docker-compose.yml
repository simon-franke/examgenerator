services:
  db:
    image: pgvector/pgvector:pg17
    container_name: examgen-pg
    environment:
      POSTGRES_PASSWORD: examgen
      POSTGRES_DB: examgen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - examgen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d examgen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  examgen-pgdata:
